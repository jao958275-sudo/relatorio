<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diário de Estágio</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#06100c;--surface:#0c1914;--raise:#102219;--text:#f2f7f4;--muted:#8fa49a;--line:rgba(255,255,255,.09);--accent:#4be3a1;--accent-ink:#04140d;--glow:rgba(75,227,161,.14);--danger:#ff8a7a;
--display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;--body:"Inter",system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f7f4;--surface:#fff;--raise:#eaf2ed;--text:#0a1612;--muted:#586b62;--line:rgba(8,30,20,.1);--accent:#0e9f63;--accent-ink:#fff;--glow:rgba(14,159,99,.12);--danger:#c7442f;color-scheme:light}}
:root[data-theme="light"]{--bg:#f3f7f4;--surface:#fff;--raise:#eaf2ed;--text:#0a1612;--muted:#586b62;--line:rgba(8,30,20,.1);--accent:#0e9f63;--accent-ink:#fff;--glow:rgba(14,159,99,.12);--danger:#c7442f;color-scheme:light}
:root[data-theme="dark"]{--bg:#06100c;--surface:#0c1914;--raise:#102219;--text:#f2f7f4;--muted:#8fa49a;--line:rgba(255,255,255,.09);--accent:#4be3a1;--accent-ink:#04140d;--glow:rgba(75,227,161,.14);--danger:#ff8a7a;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20% -20% auto auto;width:640px;height:640px;max-width:90vw;border-radius:50%;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none;animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-8%,10%) scale(1.12)}}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
main{position:relative;max-width:560px;margin:0 auto;padding:28px 20px 130px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.03em;font-weight:800}
h1{font-size:clamp(34px,9vw,44px);line-height:1}
h2{font-size:22px;font-weight:700}
.sub{color:var(--muted);margin-top:8px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:24px}
.view{animation:in .6s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(12px);filter:blur(5px)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:22px;margin-bottom:14px}
.row{display:flex;gap:14px}
.hero{display:flex;align-items:center;gap:20px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .t{stroke:var(--raise)}
.ring .p{stroke:var(--accent);stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 26px var(--display);letter-spacing:-.03em}
.big{font:800 34px/1 var(--display);letter-spacing:-.04em}
.lbl{color:var(--muted);font-size:13px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stats .card{margin:0;padding:16px}
.stats .big{font-size:24px}
.chart{display:flex;align-items:flex-end;gap:10px;height:130px;margin-top:18px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;height:100%;font-size:12px;color:var(--muted)}
.bar i{display:block;width:100%;max-width:34px;border-radius:10px;background:var(--raise);height:0;transition:height 1s cubic-bezier(.2,.8,.2,1)}
.bar.on i{background:linear-gradient(var(--accent),color-mix(in srgb,var(--accent) 40%,transparent))}
.bar.today span{color:var(--text);font-weight:500}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:20px;padding:14px 16px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:500;transition:transform .2s,box-shadow .3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px -12px var(--accent)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--raise);color:var(--text)}
.btn.sm{height:38px;padding:0 16px;font-size:14px}
.entry{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0;padding-top:0}
.entry .d{flex:none;width:52px;text-align:center;background:var(--raise);border-radius:14px;padding:8px 0;font-size:11px;color:var(--muted);line-height:1.2}
.entry .d b{display:block;font:800 20px var(--display);color:var(--text)}
.entry .m{flex:1;min-width:0}
.entry h3{font:700 16px var(--display);letter-spacing:-.01em;overflow-wrap:anywhere}
.entry p{color:var(--muted);font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.del{color:var(--muted);width:34px;height:34px;border-radius:50%;flex:none;transition:.2s}
.del:hover{background:var(--raise);color:var(--danger)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty b{display:block;font:700 20px var(--display);color:var(--text);margin-bottom:6px}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input,textarea{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .2s}
input:focus,textarea:focus{outline:0;border-color:var(--accent)}
textarea{resize:vertical;min-height:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:14px}
.tg{position:relative;width:52px;height:30px;border-radius:99px;background:var(--raise);border:1px solid var(--line);transition:.3s;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.3s cubic-bezier(.2,.8,.2,1)}
.tg[aria-checked="true"]{background:var(--accent)}
.tg[aria-checked="true"]::after{left:25px;background:var(--accent-ink)}
nav{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:99px;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 18px 40px -16px rgba(0,0,0,.5);z-index:5}
nav button{height:44px;padding:0 18px;border-radius:99px;color:var(--muted);font-weight:500;transition:.35s cubic-bezier(.2,.8,.2,1)}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(88px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--text);color:var(--bg);font-size:28px;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);z-index:5;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.fab:hover{transform:rotate(90deg) scale(1.06)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:10}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;max-height:92%;overflow:auto;transform:translate(-50%,105%);background:var(--surface);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:11}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .sheet{transform:translate(-50%,0)}
.err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:500;transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:20}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Novo registro">+</button>
<nav aria-label="Navegação">
  <button data-v="painel">Painel</button><button data-v="registros">Registros</button><button data-v="metas">Metas</button>
</nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Novo registro" aria-modal="true">
  <h2>Novo registro</h2>
  <label for="f-title">O que você fez?</label><input id="f-title" maxlength="80" placeholder="Ex.: Atendimento ao cliente">
  <div class="grid2">
    <div><label for="f-date">Data</label><input id="f-date" type="date"></div>
    <div></div>
    <div><label for="f-start">Entrada</label><input id="f-start" type="time" value="08:00"></div>
    <div><label for="f-end">Saída</label><input id="f-end" type="time" value="12:00"></div>
  </div>
  <label for="f-notes">Observações</label><textarea id="f-notes" maxlength="400" placeholder="O que você aprendeu ou observou"></textarea>
  <div class="err" id="err" role="alert"></div>
  <div class="row" style="margin-top:6px"><button class="btn ghost" id="cancel" style="flex:1">Cancelar</button><button class="btn" id="save" style="flex:2">Salvar registro</button></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
var KEY='diario-estagio-v1',S={entries:[],goals:{total:200,week:20,remindOn:false,remind:'17:00'}},view='painel';
try{var raw=localStorage.getItem(KEY);if(raw){var j=JSON.parse(raw);if(j&&j.entries)S=j}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)},p=function(n){return String(n).padStart(2,'0')};
function iso(d){return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function hrs(e){var a=e.start.split(':'),b=e.end.split(':');return Math.max(0,(b[0]*60+ +b[1]-a[0]*60- +a[1])/60)}
function fmt(h){var m=Math.round(h*60);return Math.floor(m/60)+'h'+(m%60?p(m%60):'')}
function pd(s){var a=s.split('-');return new Date(a[0],a[1]-1,a[2])}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},2200)}
function monday(){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function calc(){
  var tot=0,wk=0,days={},m=monday();
  S.entries.forEach(function(e){var h=hrs(e);tot+=h;days[e.date]=(days[e.date]||0)+h;if(e.date>=m)wk+=h});
  return{tot:tot,wk:wk,days:days,n:Object.keys(days).length}
}
function chartHtml(c){
  var out='',vals=[],mx=1,i,d;
  for(i=6;i>=0;i--){d=new Date();d.setDate(d.getDate()-i);var k=iso(d),v=c.days[k]||0;vals.push([k,v,d]);mx=Math.max(mx,v)}
  vals.forEach(function(x){out+='<div class="bar'+(x[1]?' on':'')+(x[0]===iso(new Date())?' today':'')+'"><i data-h="'+Math.round(x[1]/mx*100)+'" title="'+fmt(x[1])+'"></i><span>'+x[2].toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')+'</span></div>'});
  return out
}
function listHtml(arr){
  return arr.map(function(e){var d=pd(e.date);
    return '<div class="entry"><div class="d">'+d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'<b>'+d.getDate()+'</b></div><div class="m"><h3>'+esc(e.title)+'</h3><p>'+e.start+' – '+e.end+' · '+fmt(hrs(e))+(e.notes?'<br>'+esc(e.notes):'')+'</p></div><button class="del" data-del="'+e.id+'" aria-label="Excluir registro">✕</button></div>'}).join('')
}
function sorted(){return S.entries.slice().sort(function(a,b){return (b.date+b.start).localeCompare(a.date+a.start)})}
function render(){
  var c=calc(),g=S.goals,h=new Date().getHours(),greet=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite',html='';
  if(view==='painel'){
    var pct=g.total?Math.min(100,c.tot/g.total*100):0,wp=g.week?Math.min(100,c.wk/g.week*100):0,now=new Date(),nowT=p(now.getHours())+':'+p(now.getMinutes());
    var late=g.remindOn&&nowT>=g.remind&&!c.days[iso(now)];
    html='<div class="head"><div><h1>'+greet+'</h1><p class="sub">'+now.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})+'</p></div></div>'+
    (late?'<div class="banner"><span>Você ainda não registrou hoje.</span><button class="btn sm" id="quick">Registrar</button></div>':'')+
    '<div class="card hero"><div class="ring"><svg viewBox="0 0 120 120"><circle class="t" cx="60" cy="60" r="52"/><circle class="p" cx="60" cy="60" r="52" data-p="'+pct+'"/></svg><b>'+Math.round(pct)+'%</b></div><div><div class="big">'+fmt(c.tot)+'</div><div class="lbl">de '+g.total+'h da meta do estágio</div></div></div>'+
    '<div class="stats"><div class="card"><div class="big">'+fmt(c.wk)+'</div><div class="lbl">nesta semana</div></div><div class="card"><div class="big">'+c.n+'</div><div class="lbl">dias registrados</div></div><div class="card"><div class="big">'+Math.round(wp)+'%</div><div class="lbl">meta semanal</div></div></div>'+
    '<div class="card"><h2>Últimos 7 dias</h2><div class="chart">'+chartHtml(c)+'</div></div>'+
    '<div class="card"><h2 style="margin-bottom:16px">Recentes</h2>'+(S.entries.length?listHtml(sorted().slice(0,3)):'<div class="empty"><b>Nenhum registro ainda</b>Toque em + para anotar sua primeira atividade.</div>')+'</div>';
  }else if(view==='registros'){
    html='<div class="head"><div><h1>Registros</h1><p class="sub">'+S.entries.length+' atividades · '+fmt(c.tot)+' no total</p></div></div><div class="card">'+(S.entries.length?listHtml(sorted()):'<div class="empty"><b>Tudo em branco</b>Seus registros do estágio aparecem aqui.</div>')+'</div>';
  }else{
    html='<div class="head"><div><h1>Metas</h1><p class="sub">Defina o ritmo do seu estágio.</p></div></div><div class="card"><label for="g-total" style="margin-top:0">Total de horas do estágio</label><input id="g-total" type="number" min="1" max="2000" value="'+g.total+'"><label for="g-week">Horas por semana</label><input id="g-week" type="number" min="1" max="60" value="'+g.week+'"></div>'+
    '<div class="card"><div class="sw"><div><h2>Lembrete diário</h2><p class="sub" style="margin-top:2px">Avisa se você ainda não registrou o dia.</p></div><button class="tg" id="g-on" role="switch" aria-checked="'+g.remindOn+'" aria-label="Ativar lembrete"></button></div><label for="g-time">Horário</label><input id="g-time" type="time" value="'+g.remind+'"></div><button class="btn" id="g-save" style="width:100%">Salvar metas</button>';
  }
  $('app').innerHTML='<div class="view">'+html+'</div>';
  document.querySelectorAll('nav button').forEach(function(b){b.setAttribute('aria-current',b.dataset.v===view?'page':'false')});
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    document.querySelectorAll('.bar i').forEach(function(i){i.style.height=Math.max(6,i.dataset.h*.9)+'%'});
    var r=document.querySelector('.ring .p');if(r)r.style.strokeDashoffset=326.7*(1-r.dataset.p/100)
  })});
}
function openSheet(){$('f-date').value=iso(new Date());$('f-title').value='';$('f-notes').value='';$('err').textContent='';document.body.classList.add('open');setTimeout(function(){$('f-title').focus()},300)}
function closeSheet(){document.body.classList.remove('open')}
$('fab').onclick=openSheet;$('cancel').onclick=closeSheet;$('scrim').onclick=closeSheet;
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
$('save').onclick=function(){
  var e={id:Date.now().toString(36),title:$('f-title').value.trim(),date:$('f-date').value,start:$('f-start').value,end:$('f-end').value,notes:$('f-notes').value.trim()};
  if(!e.title)return $('err').textContent='Descreva a atividade.';
  if(!e.date||!e.start||!e.end)return $('err').textContent='Preencha data e horários.';
  if(hrs(e)<=0)return $('err').textContent='A saída deve ser depois da entrada.';
  S.entries.push(e);persist();closeSheet();render();toast('Registro salvo')
};
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){view=b.dataset.v;render();window.scrollTo({top:0,behavior:'smooth'})}});
$('app').addEventListener('click',function(ev){
  var t=ev.target.closest('button');if(!t)return;
  if(t.dataset.del){S.entries=S.entries.filter(function(e){return e.id!==t.dataset.del});persist();render();toast('Registro excluído')}
  else if(t.id==='quick')openSheet();
  else if(t.id==='g-on'){var on=t.getAttribute('aria-checked')!=='true';t.setAttribute('aria-checked',on);
    if(on){try{if(window.Notification&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}}
  else if(t.id==='g-save'){
    S.goals.total=Math.max(1,+$('g-total').value||200);S.goals.week=Math.max(1,+$('g-week').value||20);
    S.goals.remindOn=$('g-on').getAttribute('aria-checked')==='true';S.goals.remind=$('g-time').value||'17:00';
    persist();toast('Metas salvas')}
});
var notified='';
setInterval(function(){
  var g=S.goals,n=new Date(),t=p(n.getHours())+':'+p(n.getMinutes()),k=iso(n);
  if(g.remindOn&&t===g.remind&&notified!==k&&!calc().days[k]){notified=k;try{if(window.Notification&&Notification.permission==='granted')new Notification('Diário de Estágio',{body:'Hora de registrar o seu dia.'})}catch(e){}}
  if(view==='painel'&&!document.body.classList.contains('open'))return;
},30000);
render();
})();
</script>
</body>
</html>
